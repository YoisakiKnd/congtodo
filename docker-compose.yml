services:
  congtodo:
    image: ghcr.io/yoisakiknd/congtodo:latest
    # 想从源码构建时，注释掉上面的 image，改用：
    # build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - congtodo-data:/data
    environment:
      TZ: Asia/Shanghai
      # 注册策略：first（默认，只允许创建第一个账号）/ open（开放注册）/ closed
      CONGTODO_SIGNUP: first
      # 通过 HTTPS 反向代理访问时，代理会传 X-Forwarded-Proto，Cookie 自动加 Secure；
      # 如果你的代理不传这个头，可以强制开启：
      # CONGTODO_SECURE_COOKIE: "1"

volumes:
  congtodo-data:
